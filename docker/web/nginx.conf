# CrossPilot 前端 nginx：托管静态资源 + /api 反代到后端容器
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 产品 Excel 批量导入走 base64 上传，放大请求体限制
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;

    # 带内容指纹的静态资源：长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API 反代（与后端 settings.api_prefix=/api 对应）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 生成 / 真实 LLM 调用可能较慢
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 接口文档透传（可选访问 http://<host>/docs）
    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # HashRouter 不需要 history 回退，但保留兜底避免 404 白屏
    location / {
        try_files $uri $uri/ /index.html;
    }
}
