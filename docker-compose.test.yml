# 后端测试专用 PostgreSQL（临时数据，不持久化）
#
# 使用：
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && SITEPILOT_TEST_DATABASE_URL=postgresql+psycopg://crosspilot:crosspilot@127.0.0.1:55432/crosspilot_test pytest
#   docker compose -f docker-compose.test.yml down
#
# 独立 project name，避免 down 时影响正式部署的 crosspilot_default 网络。
name: crosspilot-test

services:
  db-test:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    environment:
      POSTGRES_USER: crosspilot
      POSTGRES_PASSWORD: crosspilot
      POSTGRES_DB: crosspilot_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosspilot -d crosspilot_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
