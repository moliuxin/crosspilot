name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crosspilot
          POSTGRES_PASSWORD: crosspilot
          POSTGRES_DB: crosspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crosspilot -d crosspilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SITEPILOT_DATABASE_URL: postgresql+psycopg://crosspilot:crosspilot@127.0.0.1:5432/crosspilot_test
      SITEPILOT_TEST_DATABASE_URL: postgresql+psycopg://crosspilot:crosspilot@127.0.0.1:5432/crosspilot_test
      SITEPILOT_AUTO_INIT: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run pytest (PostgreSQL)
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
